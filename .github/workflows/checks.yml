name: Checks

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Formatting
        run: uv run ruff format --check .

      - name: Type-check
        run: uv run mypy .

      - name: Check for missing migrations
        run: uv run python manage.py makemigrations --check --dry-run
        env:
          DJANGO_SETTINGS_MODULE: config.settings.testing

      # Every parser change must run against all fixture screenshots for that
      # institution, per specification section 31.3. The parser suite is part
      # of the full run below and is reported separately so a parser
      # regression is obvious at a glance.
      - name: Parser regression tests
        run: uv run pytest tests/test_institution_parsers.py -v

      - name: Tests and coverage
        run: |
          uv run coverage run --branch -m pytest
          uv run coverage report
          uv run coverage json -o coverage.json
          uv run python scripts/check_coverage.py coverage.json

  postgres:
    # The suite runs on SQLite above because it is fast. It runs here on the
    # database production actually uses, because the differences are not
    # cosmetic: select_for_update is a no-op on SQLite, and check constraints
    # and JSON lookups take different paths.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: finance_ocr_ci
          POSTGRES_USER: finance_ci
          POSTGRES_PASSWORD: finance_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U finance_ci -d finance_ocr_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Migrate
        run: uv run python manage.py migrate
        env:
          DJANGO_SETTINGS_MODULE: config.settings.ci

      - name: Check migrations against PostgreSQL
        run: uv run python manage.py makemigrations --check --dry-run
        env:
          DJANGO_SETTINGS_MODULE: config.settings.ci

      - name: Tests against PostgreSQL
        run: uv run pytest
        env:
          DJANGO_SETTINGS_MODULE: config.settings.ci

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Audit locked dependencies
        run: |
          uv export --frozen --no-dev --format requirements-txt -o /tmp/requirements.txt
          uv run --with pip-audit pip-audit --strict -r /tmp/requirements.txt

      - name: Build application image
        run: docker build --tag finance-ocr:ci .

      - name: Scan application image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: finance-ocr:ci
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
