{% extends base_template %}

{% block title %}Request error · Finance workspace{% endblock %}

{% block content %}
  <section aria-labelledby="error-heading">
    <h1 id="error-heading">We could not complete that request</h1>
    <p>{{ error.public_message }}</p>
    <p>{{ error.public_recovery_hint }}</p>
    <p>Reference: <code>{{ request_id }}</code></p>
  </section>
{% endblock %}
