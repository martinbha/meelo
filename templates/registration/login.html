{% extends "base.html" %}

{% block title %}Sign in · Finance workspace{% endblock %}

{% block content %}
  <section class="auth-card" aria-labelledby="login-heading">
    <h1 id="login-heading">Sign in</h1>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit">Sign in</button>
    </form>
    <p><a href="{% url 'password-reset' %}">Reset your password</a></p>
  </section>
{% endblock %}
