{% extends "base.html" %}
{% block title %}Verify sign-in · Finance workspace{% endblock %}
{% block content %}
<section aria-labelledby="verify-heading">
  <h1 id="verify-heading">Verify sign-in</h1>
  {% if throttled %}
    <p class="message message-error">Too many failed attempts. Try again later.</p>
  {% else %}
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit">Verify</button>
    </form>
  {% endif %}
</section>
{% endblock %}
